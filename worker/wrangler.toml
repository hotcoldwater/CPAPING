# CPAPING 크롤 트리거
#
# GitHub Actions 의 schedule 은 실행을 보장하지 않는다. 실측 결과 하루 89회
# 예약 중 12% 만 돌았고 간격도 2~3시간으로 벌어졌다. 공고를 빨리 확인하는 것이
# 이 서비스의 핵심이라 스케줄러만 Cloudflare 로 옮긴다.
#
# 크롤러 자체(Python)는 그대로 GitHub Actions 에서 돈다. 이 Worker 는 정시에
# workflow_dispatch 를 호출하는 일만 한다. dispatch 로 띄운 실행은 큐에 걸리지
# 않고 즉시 시작한다(실측 20초 내 완료).

name = "cpaping-cron"
main = "src/index.js"
compatibility_date = "2026-08-01"

[triggers]
# 종일 1분 간격 (2026-09-09, 운영자 결정). 그 전에는 10분이었다.
#
# 한공회 게시판은 등록일자를 날짜로만 주고 시각이 없어서, 게시-발견 지연의
# 상한은 곧 크롤 주기다. 1분을 약속하려면 주기 자체가 1분이어야 한다.
#
# 대가는 한공회 목록 1페이지 조회가 하루 144회 → 1,440회(10배)가 되는 것,
# GitHub Actions 실행이 하루 1,440회(공개 리포라 무료)가 되는 것이다.
# 상세 페이지는 여전히 신규 공고만 본다. 한공회 쪽에서 차단 신호(403·429,
# 빈 목록)가 보이면 10분으로 되돌린다 — 크롤러가 목록이 비면 실패로 알린다.
crons = ["* * * * *"]

[vars]
GITHUB_REPO = "hotcoldwater/CPAPING"
GITHUB_WORKFLOW = "crawl.yml"
GITHUB_REF = "main"

# 시크릿은 파일에 두지 않는다. 배포 후 아래로 등록한다.
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put RESEND_API_KEY   (선택 - 트리거 실패 알림용)
#   npx wrangler secret put ALERT_MAIL_TO    (선택)
