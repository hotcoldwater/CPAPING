<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>지원현황 — CPAPING</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/career.css"><link rel="stylesheet" href="/applications.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" crossorigin="anonymous" defer></script><script src="/auth.js" defer></script><script src="/applications.js" defer></script><link rel="stylesheet" href="/member.css"></head>
<body><div class="shell member-shell"><header class="topbar"><a href="/">CPAPING</a></header><main data-clarity-mask="true"><div class="history-title"><div><p class="eyebrow">YOUR APPLICATIONS</p><h1>지원현황</h1></div><button class="btn" id="refresh" type="button">새로고침</button></div>
<p id="message" role="status" aria-live="polite" class="status-message">지원현황을 불러오는 중…</p>
<form class="history-filters" id="history-filter-form"><label>진행 상태<select id="status"><option value="all">전체 상태</option><option value="preparing">준비 중</option><option value="review">검수 필요</option><option value="queued">발송 대기</option><option value="sending">발송 중</option><option value="sent">발송 완료</option><option value="blocked">보류</option><option value="failed">발송 실패</option><option value="delivery_unknown">발송 결과 불명</option><option value="cancelled">취소</option></select></label><label>발송 방식<select id="mode"><option value="all">전체 방식</option><option value="auto">바로 발송</option><option value="review">검수 후 발송</option><option value="test">테스트</option></select></label><label>서류 결과<select id="result"><option value="all">전체 결과</option><option value="pending">결과 대기</option><option value="received">접수 확인</option><option value="needs_review">답장 확인 필요</option><option value="passed">서류합격</option><option value="rejected">서류불합격</option></select></label><label class="history-search">법인·공고 검색<input id="search" type="search" maxlength="100" placeholder="법인명 또는 공고명"></label><button class="btn" type="submit">검색</button></form>
<div class="history-table-scroll" tabindex="0" role="region" aria-label="지원현황 표. 작은 화면에서는 좌우로 스크롤할 수 있습니다."><table class="history-table"><caption class="sr-only">공고별 지원 진행 상태와 서류 결과</caption><thead><tr><th scope="col">법인 / 지원 공고</th><th scope="col">지원일</th><th scope="col">발송 방식</th><th scope="col">진행 상태</th><th scope="col">열람 여부</th><th scope="col">서류 결과</th><th scope="col">상세</th></tr></thead><tbody id="deliveries"></tbody></table></div><p id="history-empty" class="history-empty" hidden>아직 지원 내역이 없습니다.</p><button class="btn" id="more" type="button" hidden>더 보기</button>
<p class="history-footnote">읽음 추정은 메일 이미지가 불러와진 상태이며, 담당자의 실제 열람이나 채용 접수 완료를 확정하지 않습니다. 서류 결과는 답장 자동 확인 또는 직접 기록한 내용입니다.</p>
<dialog id="application-dialog" aria-labelledby="application-detail-title"><div class="detail-heading"><h2 id="application-detail-title">지원 상세</h2><button class="btn" id="close-detail" type="button" aria-label="지원 상세 닫기">닫기 ×</button></div><p id="detail-message" role="status" aria-live="polite"></p><div id="application-detail"></div></dialog>
</main><footer><a href="/privacy">개인정보처리방침</a> · <a href="/terms">이용약관</a></footer></div></body></html>
