<style>
/*
  CPAPING 웹 (Phase 2 프로토타입)

  라이트 온리다. 뷰어 테마를 따라가지 않고 항상 밝게 고정한다.
  Stitch 초안에서 Material Design 토큰 덤프, 다크모드 클래스, 아이콘 폰트,
  사이드바를 걷어내고 실제로 쓰는 값만 남겼다.
*/
:root {
  --ink:        #101317;  /* 본문 */
  --ink-2:      #5B6472;  /* 보조 */
  --ink-3:      #868D99;  /* 흐린 */
  --line:       #E4E6EA;  /* 구분선 */
  --line-2:     #EDEFF2;  /* 행 구분선 */
  --bg:         #FFFFFF;
  --bg-subtle:  #FBFBFC;
  --bg-hover:   #F7F9FC;
  --accent:     #123A8A;  /* 버튼 */
  --urgent:     #B4341F;  /* 마감 임박 */
  --urgent-2:   #C4705F;
  --live:       #17A05F;  /* 수집 중 표시 */
  --chip-bg:    #EEF1F6;
  --chip-fg:    #4A5462;
  --chip-pt-bg: #FBF0E4;  /* 파트타임 */
  --chip-pt-fg: #8A5A19;
  --link:       #123A8A;

  --radius: 4px;
  --pad-x: 18px;
}

* { box-sizing: border-box; }

/* display 를 지정한 요소는 hidden 속성만으로 숨겨지지 않는다 */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg-subtle);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont,
               'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.shell {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  border-inline: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
@media (max-width: 720px) { .shell { border-inline: 0; } }

/* ── 상단 바 ─────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 0 var(--pad-x);
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
}
.wordmark { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
.tabs { display: flex; gap: 2px; margin-left: 14px; margin-right: auto; }
.tabs a {
  font-size: 12.5px; color: var(--ink-2); text-decoration: none;
  padding: 4px 10px; border-radius: 4px;
}
.tabs a:hover { color: var(--ink); background: var(--chip-bg); }
.tabs a[aria-current] { color: var(--ink); font-weight: 600; background: var(--chip-bg); }
.status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); }
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--live); animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

/* ── 히어로 ──────────────────────────────────────────── */
.hero { padding: 26px var(--pad-x) 22px; border-bottom: 1px solid var(--line); }
.hero h1 {
  margin: 0 0 6px; font-size: 19px; font-weight: 600;
  letter-spacing: -.02em; line-height: 1.45; text-wrap: balance;
}
.hero p.sub { margin: 0 0 16px; font-size: 13px; color: var(--ink-2); }

.subscribe { display: flex; }
.subscribe input {
  flex: 1; min-width: 0; font: inherit; font-size: 13.5px;
  padding: 10px 12px; color: var(--ink); background: var(--bg);
  border: 1px solid #CFD3DA; border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
}
.subscribe input::placeholder { color: #A2A6AD; }
.subscribe input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.subscribe button {
  font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  padding: 10px 18px; white-space: nowrap;
  color: #fff; background: var(--accent); border: 1px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.subscribe button:hover { background: #0F3073; }
.subscribe button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hint { margin: 9px 0 0; font-size: 11.5px; color: var(--ink-3); }
.hint a { color: var(--link); }
.hint.error { color: var(--urgent); }
.subscribe button[disabled] { opacity: .6; cursor: default; }

/* 구독 완료 상태 */
.subscribed { display: flex; flex-direction: column; gap: 4px; }
.subscribed .ok { font-size: 13px; display: flex; align-items: center; gap: 7px; }
.check {
  width: 15px; height: 15px; flex: none; border-radius: 50%;
  background: var(--live); position: relative;
}
.check::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 4px; height: 7px; border: solid #fff;
  border-width: 0 1.5px 1.5px 0; transform: translateY(-1px) rotate(45deg);
}
.subscribed .who { font-size: 11.5px; color: var(--ink-3); padding-left: 22px; }
.spam-hint {
  margin-top: 8px; padding: 9px 11px; border-radius: var(--radius);
  background: var(--chip-pt-bg); color: var(--chip-pt-fg);
  font-size: 11.5px; line-height: 1.6;
}
.spam-hint b { font-weight: 600; }
.subscribed .who button {
  font: inherit; font-size: 11.5px; background: none; border: 0; padding: 0 0 0 6px;
  color: var(--accent); text-decoration: underline; cursor: pointer;
}

/* ── 목록 ────────────────────────────────────────────── */
.listhead {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 13px var(--pad-x) 10px; background: var(--bg-subtle);
  border-bottom: 1px solid var(--line);
}
.listhead h2 { margin: 0; font-size: 13px; font-weight: 600; }
.listhead .count { font-size: 12px; color: var(--ink-2); }

/* 필터 + 정렬 */
.controls {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 9px var(--pad-x);
  background: var(--bg-subtle); border-bottom: 1px solid var(--line);
}
.filters { display: flex; gap: 5px; }
.filters button {
  font: inherit; font-size: 11.5px; cursor: pointer;
  padding: 4px 10px; border-radius: var(--radius);
  color: var(--ink-2); background: var(--bg); border: 1px solid var(--line);
}
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] {
  color: #fff; background: var(--ink); border-color: var(--ink);
}
.filters button .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.sort {
  font: inherit; font-size: 11.5px; cursor: pointer; white-space: nowrap;
  padding: 4px 10px; border-radius: var(--radius);
  color: var(--ink-2); background: var(--bg); border: 1px solid var(--line);
}
.sort:hover { color: var(--ink); }
.filters button:focus-visible, .sort:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}

/* 등록일 · NEW */
.row .posted { color: var(--ink-3); }
.badge {
  display: inline-block; margin-left: 6px; padding: 0 5px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .04em;
  border-radius: 2px; vertical-align: 1px; white-space: nowrap;
}
.badge.new  { background: #E7EDF9; color: var(--accent); }
/* 끌올은 '새 소식' 이 아니라 '오래 안 채워진 자리' 라는 신호다.
   NEW 와 색을 나눠 한눈에 구분되게 한다. */
.badge.repost { background: var(--chip-pt-bg); color: var(--chip-pt-fg); }

/* 게시판에서 내려간 공고 — 지원 흐름을 방해하지 않도록 하단에 접어 둔다 */
.closed-section { border-top: 1px solid var(--line); }
.closed-toggle {
  width: 100%; font: inherit; font-size: 12px; text-align: left; cursor: pointer;
  padding: 13px var(--pad-x); color: var(--ink-2);
  background: var(--bg-subtle); border: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.closed-toggle:hover { color: var(--ink); }
.closed-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.closed-toggle .caret { color: var(--ink-3); font-size: 10px; }
.closed-list .row { opacity: .62; }
.closed-list .row:hover { opacity: 1; }
.closed-list .dday { color: var(--ink-3); font-weight: 400; }

.rows { display: flex; flex-direction: column; }

.row {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
  padding: 13px var(--pad-x);
  border-bottom: 1px solid var(--line-2);
  color: inherit; text-decoration: none;
}
.row:hover { background: var(--bg-hover); }

.row .firm { font-size: 11.5px; color: var(--ink-2); }
.row .title {
  display: block; font-size: 13.5px; font-weight: 500; line-height: 1.45;
  letter-spacing: -.01em; margin-top: 2px;
  color: inherit; text-decoration: none;
}
a.title:hover { color: var(--accent); }
.firm-link { color: inherit; text-decoration: none; }
.firm-link:hover { color: var(--accent); text-decoration: underline; }
.row a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.row .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chip {
  font-size: 10.5px; line-height: 1.5; padding: 1.5px 7px; border-radius: 3px;
  background: var(--chip-bg); color: var(--chip-fg);
}
.chip.pt { background: var(--chip-pt-bg); color: var(--chip-pt-fg); }

.row .due {
  text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.row .dday { font-size: 12px; font-weight: 500; }
.row .date { display: block; font-size: 10.5px; color: var(--ink-3); }
.row.soon .dday { color: var(--urgent); }
.row.soon .date { color: var(--urgent-2); }

/* ── 더 보기 / 빈 상태 ───────────────────────────────── */
.more { padding: 14px var(--pad-x); display: flex; justify-content: center; }
.more button {
  font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer;
  padding: 7px 16px; background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.more button:hover { background: var(--bg-subtle); color: var(--ink); }
.more button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.empty {
  min-height: 120px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; text-align: center;
  padding: 0 var(--pad-x);
}
.empty .lead { font-size: 13.5px; font-weight: 500; }
.empty .sub { font-size: 12px; color: var(--ink-2); }

/* ── 푸터 ────────────────────────────────────────────── */
footer {
  margin-top: auto; padding: 20px var(--pad-x);
  background: var(--bg-subtle); border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink-3); text-align: center;
}
footer a { color: var(--ink-2); text-decoration: none; }
footer a:hover { text-decoration: underline; }
footer .sep { margin: 0 7px; opacity: .5; }
footer .footer-links { margin-top: 6px; }
footer .footer-mail { margin-top: 4px; font-size: 11px; opacity: .75; user-select: all; }
</style>
</head>

  { key: "part", label: "파트타임", match: (p) => p.employment_type === "Part Time" },
];

const SORTS = {
  // 목록이 하는 일은 "지난번 이후 뭐가 바뀌었나" 를 보여주는 것이라
  // 최신순을 기본으로 둔다. 마감 임박 건은 D-day 가 빨갛게 표시된다.
  posted:   { label: "최신순",      compare: (a, b) => (b.posted_at || "").localeCompare(a.posted_at || "") },
  deadline: { label: "마감 임박순", compare: (a, b) => a.deadline.localeCompare(b.deadline) },
};
const DEFAULT_SORT = "posted";

const state = { postings: [], filter: "all", sort: DEFAULT_SORT };

const $ = (id) => document.getElementById(id);

/** 설정을 브라우저에 기억시킨다. 시크릿 모드 등에서 실패해도 무시한다. */
const remember = {
  get(key, fallback) {
    try { return localStorage.getItem("cpaping." + key) || fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("cpaping." + key, value); } catch { /* 무시 */ }
  },
};

/** 오늘 자정 기준 남은 일수. 시간대에 따라 하루가 어긋나는 것을 막는다. */
function daysLeft(isoDate) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const [y, m, d] = isoDate.split("-").map(Number);
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}

/** 며칠 전에 올라온 공고인지. 날짜가 없으면 오래된 것으로 본다. */
function daysSincePosted(isoDate) {
  return isoDate ? -daysLeft(isoDate) : Infinity;
}

/** "2026-08-28" → "08.28" */
function shortDate(isoDate) {
  return isoDate ? isoDate.slice(5).replace("-", ".") : "";
}

/**
 * 공고의 회사명을 법인 페이지 주소로 바꾼다.
 * 크롤러의 canonical_name / slugify 와 같은 규칙이어야 한다.
 */
function firmSlug(name) {
  let n = String(name || "").replace(/\s*\([^)]*\)/g, "").trim();
  n = n.replace(/\s*[가-힣A-Za-z0-9]*(지점|본점|사업부|사업본부|본부)\s*$/, "");
  n = n.replace(/\s+/g, " ").trim();
  n = prefixToSuffix(n);
  n = { "대현회게법인": "대현회계법인", "안진회게법인": "안진회계법인" }[n] || n;
  return n.replace(/[^가-힣A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/**
 * '회계법인 베율' → '베율회계법인'.
 *
 * 이름을 다는 방식이 두 가지다. 공고를 접두사형으로 올리는 곳이 있는데,
 * 사업보고서와 법인 페이지 주소는 접미사형을 쓴다. 맞춰 두지 않으면
 * 없는 주소로 링크가 걸리고 화면에도 두 표기가 섞인다.
 */
function prefixToSuffix(name) {
  const m = String(name || "").match(/^\(?(?:유|주|합|유한)?\)?\s*회계법인\s*(.+)$/);
  return m ? m[1].trim() + "회계법인" : name;
}

/** 목록에 보일 이름. 지점 표기는 남기고 접두사형만 바로잡는다. */
function firmLabel(name) {
  return prefixToSuffix(String(name || "").trim());
}

/**
 * 제목 앞머리의 법인명 반복을 지운다.
 * "[광교회계법인] 수습회계사 모십니다." → "수습회계사 모십니다."
 * 바로 위에 법인명이 이미 있어서 두 번 읽을 이유가 없다.
 */
function trimTitle(title, firm) {
  let out = title.trim();
  const head = out.match(/^[[(【]([^\])】]{1,30})[\])】]\s*/);
  if (head) {
    const inner = head[1].replace(/\s/g, "");
    const bare = (firm || "").replace(/\s|\(.*\)/g, "");
    // 괄호 안이 법인명을 담고 있을 때만 지운다 (부서명 등은 남긴다)
    if (bare && (inner.includes(bare) || inner.includes(bare.slice(0, 3)))) {
      out = out.slice(head[0].length);
    }
  }
  return out.replace(/^[-—·\s]+/, "").replace(/-{2,}/g, " — ").trim() || title;
}

function chip(text, extraClass) {
  const el = document.createElement("span");
  el.className = "chip" + (extraClass ? " " + extraClass : "");
  el.textContent = text;
  return el;
}

function renderRow(p, options = {}) {
  const left = daysLeft(p.deadline);
  // 행 전체를 링크로 두면 법인명에 다른 링크를 걸 수 없다(중첩 불가).
  // 제목 = 공고 원문, 법인명 = 법인 페이지로 나눈다.
  const row = document.createElement("div");
  row.className = "row" + (!options.closed && left <= SOON_DAYS ? " soon" : "");

  const main = document.createElement("div");

  const firm = document.createElement("div");
  firm.className = "firm";
  const slug = firmSlug(p.company_name);
  if (slug) {
    const link = document.createElement("a");
    link.className = "firm-link";
    link.href = "/firm/" + encodeURIComponent(slug);
    link.textContent = firmLabel(p.company_name);
    firm.append(link);
  } else {
    firm.append(firmLabel(p.company_name));
  }
  if (p.posted_at) {
    const posted = document.createElement("span");
    posted.className = "posted";
    posted.textContent = " · " + shortDate(p.posted_at) + " 등록";
    firm.append(posted);
  }
  // 끌올은 "오래 안 채워진 자리" 라는 신호라 기간과 무관하게 계속 보여준다.
  // NEW 는 최근에 처음 올라온 것에만 붙인다.
  if (p.original_posted_at) {
    const badge = document.createElement("span");
    badge.className = "badge repost";
    badge.textContent = "끌올 · 최초 " + shortDate(p.original_posted_at);
    firm.append(badge);
  } else if (daysSincePosted(p.posted_at) <= NEW_DAYS) {
    const badge = document.createElement("span");
    badge.className = "badge new";
    badge.textContent = "NEW";
    firm.append(badge);
  }

  const title = p.detail_url ? document.createElement("a") : document.createElement("div");
  title.className = "title";
  if (p.detail_url) {
    title.href = p.detail_url;
    title.target = "_blank";
    title.rel = "noopener";
  }
  title.textContent = trimTitle(p.title, p.company_name);

  const chips = document.createElement("div");
  chips.className = "chips";
  if (p.region) chips.append(chip(p.region));
  chips.append(p.employment_type === "Part Time" ? chip("파트타임", "pt") : chip("정규직"));

  main.append(firm, title, chips);

  const due = document.createElement("div");
  due.className = "due";
  const dday = document.createElement("span");
  dday.className = "dday";
  const date = document.createElement("small");
  date.className = "date";
  if (options.closed) {
    dday.textContent = "공고 내림";
    date.textContent = shortDate(p.removed_at.slice(0, 10));
  } else {
    dday.textContent = left === 0 ? "오늘 마감" : "D-" + left;
    date.textContent = shortDate(p.deadline);
  }
  due.append(dday, date);

  row.append(main, due);
  return row;
}

const CLOSED_WINDOW_DAYS = 30;   // 내려간 지 이만큼 지나면 목록에서 뺀다

/** 지금 지원할 수 있는 공고. 마감된 건은 크롤러가 걸러주지만 화면에서도 한 번 더 막는다 */
function openPostings() {
  return state.postings.filter(
    (p) => !p.removed_at && p.deadline && daysLeft(p.deadline) >= 0
  );
}

/**
 * 한공회 게시판에서 내려간 공고.
 *
 * 내려간 이유는 세 가지인데 구분할 수 없다 — 채용이 됐거나, 마감일이
 * 지났거나, 한공회가 등록 1개월 뒤 자동으로 지웠거나. 그래서 "채용 완료"
 * 라고 단정하지 않고 "공고 내림" 이라고만 적는다.
 */
function closedPostings() {
  return state.postings
    .filter((p) => p.removed_at)
    .filter((p) => {
      const days = (Date.now() - new Date(p.removed_at)) / 86400000;
      return days <= CLOSED_WINDOW_DAYS;
    })
    .sort((a, b) => b.removed_at.localeCompare(a.removed_at));
}

function renderClosed() {
  const list = closedPostings();
  const section = $("closed-section");
  section.hidden = list.length === 0;
  if (!list.length) return;

  $("closed-label").textContent = `최근 내려간 공고 ${list.length}건`;

  const rows = $("closed-rows");
  rows.replaceChildren();
  for (const p of list) {
    const row = renderRow(p, { closed: true });
    rows.append(row);
  }
}

function renderFilters() {
  const open = openPostings();
  const box = $("filters");
  box.replaceChildren();
  for (const f of FILTERS) {
    const n = open.filter(f.match).length;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(state.filter === f.key));
    btn.append(f.label);
    const count = document.createElement("span");
    count.className = "n";
    count.textContent = n;
    btn.append(count);
    btn.disabled = n === 0 && f.key !== "all";
    btn.onclick = () => {
      state.filter = f.key;
      remember.set("filter", f.key);
      renderList();
    };
    box.append(btn);
  }
}

function renderList() {
  const filter = FILTERS.find((f) => f.key === state.filter) || FILTERS[0];
  const list = openPostings().filter(filter.match).sort(SORTS[state.sort].compare);

  $("count").textContent = list.length ? list.length + "건" : "0건";
  $("empty").hidden = list.length > 0;
  $("controls").hidden = openPostings().length === 0;
  $("sort").textContent = SORTS[state.sort].label + " ⇅";

  const rows = $("rows");
  rows.replaceChildren();
  list.forEach((p, i) => {
    const row = renderRow(p);
    if (i >= VISIBLE_AT_FIRST) row.hidden = true;
    rows.append(row);
  });

  const hidden = Math.max(0, list.length - VISIBLE_AT_FIRST);
  const more = $("more");
  more.hidden = hidden === 0;
  if (hidden) {
    const btn = more.querySelector("button");
    btn.textContent = "외 " + hidden + "건 더 보기";
    btn.onclick = () => {
      rows.querySelectorAll(".row[hidden]").forEach((r) => (r.hidden = false));
      more.hidden = true;
    };
  }

  renderFilters();
  renderClosed();
}

function render(postings) {
  state.postings = postings;
  renderList();
}

async function load() {
  state.filter = remember.get("filter", "all");
  const savedSort = remember.get("sort", DEFAULT_SORT);
  state.sort = SORTS[savedSort] ? savedSort : DEFAULT_SORT;

  $("sort").onclick = () => {
    state.sort = state.sort === "posted" ? "deadline" : "posted";
    remember.set("sort", state.sort);
    renderList();
  };

  render(FALLBACK);
  if (SUPABASE_URL.startsWith("__")) return; // 키가 안 채워진 미리보기
  try {
    // 내려간 공고도 함께 받아 하단 구역에 보여준다
    const url = SUPABASE_URL +
      "/rest/v1/job_postings?select=company_name,title,region,deadline,posted_at," +
      "employment_type,detail_url,removed_at,original_posted_at,repost_count" +
      "&is_target=is.true&order=posted_at.desc";
    const res = await fetch(url, { headers: { apikey: SUPABASE_KEY } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (Array.isArray(data)) render(data);
  } catch (err) {
    // 실시간 조회에 실패해도 화면은 그대로 둔다
    console.warn("공고를 불러오지 못했습니다:", err.message);
  }
}

const MESSAGES = {
  pending: "확인 메일을 보냈습니다. 링크를 눌러야 구독이 완료됩니다.",
  already: "이미 구독 중인 주소입니다.",
};

// 네이버 메일에서 확인 메일이 스팸함으로 가는 경우가 있다.
// 실제로 확인 대기자의 대부분이 네이버 사용자였다.
const SPAM_HINT =
  "메일이 안 보이면 <b>스팸함</b>을 확인해 주세요. " +
  "보낸사람은 <b>noreply@cpaping.com</b> 입니다.";

const form = $("subscribe-form");
const button = form.querySelector("button");
const HINT_DEFAULT = $("hint").innerHTML;

function showSent(email, status) {
  $("subscribed-msg").textContent = MESSAGES[status] || MESSAGES.pending;
  $("subscribed-email").textContent = email;
  const hint = $("spam-hint");
  hint.innerHTML = SPAM_HINT;
  hint.hidden = status === "already";
  form.hidden = true;
  $("hint").hidden = true;
  $("subscribed").hidden = false;
}

function showError(message) {
  const hint = $("hint");
  hint.textContent = message;
  hint.classList.add("error");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  if (!email) return;

  button.disabled = true;
  button.textContent = "전송 중";
  $("hint").classList.remove("error");

  try {
    const res = await fetch("/api/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // 지금 보고 있는 필터를 그대로 구독 조건으로 쓴다
      body: JSON.stringify({ email, filter: state.filter }),
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      showError(data.error || "잠시 후 다시 시도해 주세요.");
      return;
    }
    showSent(email, data.status);
  } catch {
    showError("연결에 실패했습니다. 잠시 후 다시 시도해 주세요.");
  } finally {
    button.disabled = false;
    button.textContent = "구독";
  }
});

// 내려간 공고 구역 접기/펼치기
$("closed-toggle").addEventListener("click", () => {
  const rows = $("closed-rows");
  const open = rows.hidden;
  rows.hidden = !open;
  $("closed-toggle").setAttribute("aria-expanded", String(open));
  $("closed-caret").textContent = open ? "▴" : "▾";
});

$("change").addEventListener("click", () => {
  $("subscribed").hidden = true;
  form.hidden = false;
  const hint = $("hint");
  hint.hidden = false;
  hint.classList.remove("error");
  hint.innerHTML = HINT_DEFAULT;
  $("email").value = "";
  $("email").focus();
});

load();
</script>

</body>
</html>
