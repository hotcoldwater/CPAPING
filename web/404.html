<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — CPAPING</title>
<!-- 검색엔진이 이 페이지를 색인하지 않게 한다. 없는 주소마다 같은 내용이
     색인되면 사이트 전체가 중복 덩어리로 보인다. -->
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root { --ink:#101317; --ink-2:#5B6472; --ink-3:#868D99;
          --line:#E4E6EA; --bg:#FBFBFC; --accent:#123A8A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
         font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:720px; margin:0 auto; min-height:100vh; background:#fff;
          border-inline:1px solid var(--line); display:flex; flex-direction:column; }
  @media (max-width:720px) { .wrap { border-inline:0; } }
  .bar { height:44px; display:flex; align-items:center; gap:16px; padding:0 18px;
         background:var(--bg); border-bottom:1px solid var(--line); }
  .bar .brand { font-size:13.5px; font-weight:600; letter-spacing:-.01em;
                color:var(--ink); text-decoration:none; }
  .bar a.nav { font-size:13px; color:var(--ink-2); text-decoration:none; }
  .bar a.nav:hover { color:var(--accent); }
  main { flex:1; display:flex; flex-direction:column; align-items:center;
         justify-content:center; text-align:center; padding:56px 18px; gap:10px; }
  .code { font-size:12px; letter-spacing:.14em; color:var(--ink-3); }
  h1 { margin:0; font-size:19px; font-weight:600; letter-spacing:-.02em; }
  p { margin:0; font-size:13px; color:var(--ink-2); max-width:34em; }
  .links { margin-top:24px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .links a { display:inline-block; padding:10px 18px; font-size:13.5px;
             font-weight:500; text-decoration:none; border-radius:4px; }
  .links a.primary { background:var(--accent); color:#fff; }
  .links a.ghost { color:var(--ink-2); border:1px solid var(--line); background:#fff; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  footer { padding:20px 18px; background:var(--bg); border-top:1px solid var(--line);
           font-size:11.5px; color:var(--ink-3); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="/">CPAPING</a>
    <a class="nav" href="/firms/">법인</a>
  </div>
  <main>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나, 공고가 내려갔거나, 없는 법인일 수 있습니다.
       한공회는 등록 1개월이 지난 공고를 자동으로 지웁니다.</p>
    <div class="links">
      <a class="primary" href="/">공고 보러 가기</a>
      <a class="ghost" href="/firms/">회계법인 찾아보기</a>
    </div>
  </main>
  <footer>CPAPING · 한국공인회계사회 공고를 수집합니다</footer>
</div>
</body>
</html>
