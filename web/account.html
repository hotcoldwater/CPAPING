<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 정보 — CPAPING</title>
<style>select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid #CFD3DA;border-radius:4px;background:#fff;color:#101317}</style>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#123A8A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="/auth.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="wordmark" href="/">CPAPING</a>
    <nav aria-label="주요 화면"><a href="/">공고</a><a href="/firms/">법인</a><a href="/board/">게시판</a></nav>
  </header>
  <main>

    <h1>내 정보</h1>
    <div class="who"><span id="nick"></span><span class="chip" id="providers"></span></div>

    <section id="recovery" hidden>
      <div class="msg">새 비밀번호를 정해 주세요.</div>
      <form id="pw-form" novalidate>
        <label for="pw">새 비밀번호 (8자 이상)</label>
        <input id="pw" type="password" autocomplete="new-password" minlength="8" required data-clarity-mask="true">
        <button class="btn primary" type="submit" style="margin-top:12px">비밀번호 바꾸기</button>
      </form>
    </section>

    <dl class="facts">
      <div><dt>이메일</dt><dd id="email"></dd></div>
      <div><dt>가입</dt><dd id="joined"></dd></div>
    </dl>

    <section class="alerts" style="margin:0 0 22px;padding:14px 16px;border:1px solid var(--line);border-radius:4px">
      <label class="check" style="margin:0"><input type="checkbox" id="alert-on">
        <span><b>새 공고 알림 받기</b> <span class="muted small" id="alert-state"></span></span></label>
      <div id="alert-opts" hidden style="margin-top:8px">
        <label for="region">지역</label>
        <select id="region"><option value="all">전국</option><option value="capital">수도권 (서울·경기·인천)</option><option value="local">지방</option></select>
        <div class="kinds" role="group" aria-label="받을 공고" style="margin-top:10px">
          <label class="check"><input type="checkbox" id="kind-full" checked> <span>신입 정규직</span></label>
          <label class="check"><input type="checkbox" id="kind-part" checked> <span>신입 파트타임</span></label>
          <label class="check"><input type="checkbox" id="kind-career"> <span>경력 <span class="muted small">회계사 경력 채용 · 빅4·일반기업 포함, 기장·사무 직원 공고 제외</span></span></label>
        </div>
        <button class="btn" type="button" id="alert-save" style="margin-top:10px">알림 조건 저장</button>
      </div>
    </section>

    <form id="nick-form" novalidate>
      <label for="nickname">닉네임 바꾸기</label>
      <input id="nickname" type="text" minlength="2" maxlength="12" required>
      <button class="btn" type="submit" style="margin-top:10px">저장</button>
    </form>

    <div class="msg" id="msg" hidden role="status" aria-live="polite"></div>

    <p style="margin-top:22px"><button class="btn" type="button" id="logout">로그아웃</button></p>

    <p class="danger">계정을 지우려면 <button class="linkish" type="button" id="delete">탈퇴</button>.
      이메일 등 계정 정보와 알림 구독은 즉시 삭제됩니다. 남긴 댓글은 "탈퇴한 사용자"로 남습니다(<a href="/terms">약관 제10조</a>).</p>
<script>
(async () => {
  const A = window.cpAuth, $ = (id) => document.getElementById(id);
  const msg = (text, kind) => { const m = $("msg"); m.textContent = text; m.className = "msg" + (kind ? " " + kind : ""); m.hidden = false; };
  const params = new URLSearchParams(location.search);

  const s = await A.ensure(params.get("recovery") ? "needs_email" : "complete");
  if (!s.user) return;
  if (params.get("recovery")) $("recovery").hidden = false;

  $("nick").textContent = (s.profile && s.profile.nickname) || "(닉네임 없음)";
  $("email").textContent = A.maskEmail(s.user.email) || "없음";
  $("joined").textContent = new Date(s.user.created_at).toLocaleDateString("ko-KR");
  const provs = (s.user.identities || []).map((i) => ({ google: "Google", kakao: "Kakao", email: "이메일" }[i.provider] || i.provider));
  $("providers").textContent = provs.join(" · ") || "";
  $("nickname").value = (s.profile && s.profile.nickname) || "";

  $("pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("pw").value;
    if (pw.length < 8) return msg("비밀번호는 8자 이상이어야 합니다.", "err");
    const { error } = await A.client.auth.updateUser({ password: pw });
    if (error) return msg(A.humanize(error), "err");
    msg("비밀번호를 바꿨습니다.", "ok"); $("recovery").hidden = true;
    history.replaceState(null, "", "/account/");
  });

  $("nick-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nickname = $("nickname").value.trim();
    if (nickname.length < 2 || nickname.length > 12) return msg("닉네임은 2~12자여야 합니다.", "err");
    const { error } = await A.client.from("profiles").update({ nickname }).eq("user_id", s.user.id);
    if (error) return msg(A.humanize(error), "err");
    $("nick").textContent = nickname; msg("저장했습니다.", "ok");
  });

  // 알림 구독 — 서버가 사용자 토큰을 확인하고 subscribers 를 대신 만진다
  const authHeader = async () => { const { data: { session } } = await A.client.auth.getSession(); return { Authorization: "Bearer " + session.access_token }; };
  async function loadAlert() {
    const res = await fetch("/api/me/subscription", { headers: await authHeader() }).catch(() => null);
    const sub = res && res.ok ? await res.json() : { active: false };
    $("alert-on").checked = !!sub.active;
    $("alert-opts").hidden = !sub.active;
    if (sub.active) {
      $("region").value = sub.region_filter || "all";
      $("kind-full").checked = sub.want_trainee_full !== false;
      $("kind-part").checked = sub.want_trainee_part !== false;
      $("kind-career").checked = sub.want_career === true;
    }
    $("alert-state").textContent = sub.active ? "— 받는 중" : "— 꺼짐";
  }
  await loadAlert();
  const conditions = () => ({ region_filter: $("region").value, want_trainee_full: $("kind-full").checked,
                              want_trainee_part: $("kind-part").checked, want_career: $("kind-career").checked });
  const nothing = (c) => !c.want_trainee_full && !c.want_trainee_part && !c.want_career;
  $("alert-on").addEventListener("change", async () => {
    const on = $("alert-on").checked;
    const res = await fetch("/api/me/subscription", { method: on ? "PUT" : "DELETE",
      headers: { ...(await authHeader()), "Content-Type": "application/json" },
      body: on ? JSON.stringify(conditions()) : undefined });
    if (!res.ok) { msg("알림 설정을 바꾸지 못했습니다. 잠시 뒤 다시 시도해 주세요.", "err"); return loadAlert(); }
    msg(on ? "새 공고 알림을 받습니다." : "알림을 껐습니다.", "ok"); await loadAlert();
  });
  $("alert-save").onclick = async () => {
    const c = conditions();
    if (nothing(c)) return msg("받을 공고를 하나 이상 골라 주세요. 알림을 그만 받으려면 위의 체크를 끄세요.", "err");
    const res = await fetch("/api/me/subscription", { method: "PUT",
      headers: { ...(await authHeader()), "Content-Type": "application/json" },
      body: JSON.stringify(c) });
    msg(res.ok ? "알림 조건을 저장했습니다. 다음 공고부터 적용됩니다." : "저장하지 못했습니다.", res.ok ? "ok" : "err");
  };

  $("logout").onclick = async () => { await A.signOut(); location.replace("/"); };

  $("delete").onclick = async () => {
    if (!confirm("정말 탈퇴할까요? 계정 정보가 즉시 삭제되고 되돌릴 수 없습니다.")) return;
    const { data: { session } } = await A.client.auth.getSession();
    const res = await fetch("/api/account", { method: "DELETE", headers: { Authorization: "Bearer " + session.access_token } });
    if (!res.ok) return msg("탈퇴를 처리하지 못했습니다. contact@cpaping.com 으로 알려주세요.", "err");
    await A.signOut();
    location.replace("/?left=1");
  };
})();
</script>
  </main>
  <footer>CPAPING · <a href="/terms">이용약관</a> · <a href="/privacy">개인정보처리방침</a> · <a href="mailto:contact@cpaping.com">contact@cpaping.com</a></footer>
</div>
</body>
</html>
