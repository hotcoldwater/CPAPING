name: 공고 지원 요건 분석
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: application-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: career/requirements.txt
      - run: pip install -r career/requirements.txt
      - run: python -m career.analysis_queue
        env:
          CAREER_RESUME_ENABLED: ${{ vars.CAREER_RESUME_ENABLED }}
          CAREER_SEND_ENABLED: ${{ vars.CAREER_SEND_ENABLED }}
          GH_DELIVERY_TOKEN: ${{ github.token }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: 지원내역 복구와 안내 처리
        if: vars.CAREER_RESUME_ENABLED == 'true'
        run: python -m career.resume_runner
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          CAREER_RESUME_ENABLED: 'true'
          GH_DELIVERY_TOKEN: ${{ github.token }}
          CAREER_SEND_ENABLED: ${{ vars.CAREER_SEND_ENABLED }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAIL_TOKEN_KEY: ${{ secrets.MAIL_TOKEN_KEY }}
          GOOGLE_MAIL_CLIENT_ID: ${{ secrets.GOOGLE_MAIL_CLIENT_ID }}
          GOOGLE_MAIL_CLIENT_SECRET: ${{ secrets.GOOGLE_MAIL_CLIENT_SECRET }}
