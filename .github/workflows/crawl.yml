name: 한공회 공고 크롤링

on:
  schedule:
    # GitHub Actions 의 cron 은 UTC 기준이다. KST = UTC + 9.
    # 업무 시간(KST 08:00~20:59)에는 10분 간격
    - cron: "*/10 23,0-11 * * *"
    # 그 외 시간(KST 21:00~07:59)에는 1시간 간격
    - cron: "0 12-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB 저장/메일 없이 결과만 확인"
        type: boolean
        default: false

# 실행이 겹치면 중복 알림이 나갈 수 있으므로 한 번에 하나만 돈다.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: 의존성 설치
        run: pip install -r crawler/requirements.txt

      - name: 크롤 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CPAPING_SMTP_USER: ${{ secrets.CPAPING_SMTP_USER }}
          CPAPING_SMTP_APP_PASSWORD: ${{ secrets.CPAPING_SMTP_APP_PASSWORD }}
          CPAPING_MAIL_TO: ${{ secrets.CPAPING_MAIL_TO }}
        run: |
          python crawler/main.py ${{ inputs.dry_run && '--dry-run' || '' }}
